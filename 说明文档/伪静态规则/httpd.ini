# ========================================================================
# maccms12 (ThinkPHP 8) - IIS6 (ISAPI_Rewrite) rewrite rules
# 放到站点根目录，配合 httpd.ini 使用的 ISAPI_Rewrite 组件。
# 仅前台 index.php 走伪静态；admin.php/api.php/install.php 是真实文件，
# 不受影响。
# ========================================================================
[ISAPI_Rewrite]
#3600 = 1 hour

CacheClockRate 3600
RepeatLimit 32

RewriteRule (.*)$ /index\.php\?s=$1 [I]

# ========================================================================
# 关于「内部文件禁止下载」：ISAPI_Rewrite 2.x 没有可靠的 [F] 拦截标志，
# IIS6 也没有 requestFiltering，本文件无法提供同等保护。
# 仍需在 IIS6 上部署时，请把 说明文档/ 目录移出网站根目录（前台与后台运行都不依赖
# 它，移走不影响站点），并参照 web.config 的 requestFiltering 段落升级到 IIS7+。
# 注意移走后后台「文档与手册 → 说明文档」阅读页也就没有可列的文件了，需要手册请
# 在本机保留一份副本。
# ========================================================================
