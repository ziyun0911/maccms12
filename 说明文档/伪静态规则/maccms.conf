# ========================================================================
# maccms12 (ThinkPHP 8) - nginx rewrite rules
# 放入 nginx 站点 server 块（或 include 本文件）。
# index.php(前台)/admin.php(后台)/api.php(接口) 三个入口均做 s 参数兼容；
# install.php 为真实文件，!-e 判断通过即不走 rewrite。
# 若站点部署在子目录（如 /maccms12），请把下面 4 条 rewrite 中的路径
# 前缀改为 /maccms12/index.php、/maccms12/admin.php 等。
# ========================================================================
location / {
 if (!-e $request_filename) {
        rewrite ^/index.php(.*)$ /index.php?s=$1 last;
        rewrite ^/admin.php(.*)$ /admin.php?s=$1 last;
        rewrite ^/api.php(.*)$ /api.php?s=$1 last;
        rewrite ^(.*)$ /index.php?s=$1 last;
        break;
   }
}

# ========================================================================
# 访问控制：内部目录/文件一律 404（PHP 侧读文件不走 HTTP，不影响运行）。
# 顺序说明：^~ 的 .well-known 必须排在正则之前，否则 HTTPS 证书
# HTTP-01 校验会被下面的隐藏文件规则挡掉。
# 前台业务路由（vod/art/type/search/... ）不在拦截名单内，保持原样。
# ========================================================================
location ^~ /.well-known/ {
    allow all;
}
location ~ ^/(说明文档|runtime|vendor|config|app|extend)(/|$) {
    return 404;
}
location ~ /\. {
    return 404;
}
location ~* \.(md|sql|log|lock|wpm|sh|ps1|py)$ {
    return 404;
}
location = /composer.json { return 404; }
location = /composer.lock { return 404; }
location = /think { return 404; }
