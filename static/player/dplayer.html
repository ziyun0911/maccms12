<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
	<title>dplayer播放器</title>
	<script type="text/javascript">
	// 兼容层：旧播放器脚本（浏览器缓存）仍指向 dplayer.html，此处跳到 dplayer.php，避免 404
	(function () {
		try {
			var q = location.search || '';
			location.replace('dplayer.php' + q);
		} catch (e) {
			location.href = 'dplayer.php';
		}
	})();
	</script>
</head>
<body style="margin:0;background:#000"></body>
</html>
