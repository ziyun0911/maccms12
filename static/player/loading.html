<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
	<title>加载中</title>
	<style type="text/css">
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: rgba(0, 0, 0, 0.55);
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.mac-loading-spinner {
		width: 34px;
		height: 34px;
		border: 3px solid rgba(255, 255, 255, 0.25);
		border-top-color: #ffffff;
		border-radius: 50%;
		animation: mac-spin 0.9s linear infinite;
	}
	@keyframes mac-spin {
		to { transform: rotate(360deg); }
	}
	</style>
</head>
<body>
<div class="mac-loading-spinner"></div>
</body>
</html>
