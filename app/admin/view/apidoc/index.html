{include file="../../../app/admin/view/public/head" /}

<link rel="stylesheet" href="__STATIC__/swagger/swagger-ui.css?{$MAC_VERSION}">
<style>
    /* 只覆盖 swagger 的展示样式，不改 static/swagger/ 里的第三方文件 */
    .apidoc-page {
        min-height: 100%;
        padding-bottom: 28px;
        background: #f0f3f7;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #1a2233;
    }

    .apidoc-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px 14px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e8edf3;
        box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
    }

    .apidoc-bar__title {
        font-size: 16px;
        font-weight: 600;
        color: #1a2233;
    }

    .apidoc-bar__desc {
        font-size: 12px;
        color: #64748b;
        flex: 1 1 220px;
        min-width: 0;
    }

    .apidoc-bar__chip {
        font-size: 12px;
        color: #2db87d;
        background: #e4f8f0;
        border: 1px solid rgba(64, 204, 146, .24);
        border-radius: 6px;
        padding: 3px 8px;
        word-break: break-all;
    }

    .apidoc-bar__stat {
        font-size: 12px;
        color: #94a3b8;
    }

    .apidoc-bar__ops {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .apidoc-bar__ops .layui-btn {
        margin: 0;
        border-radius: 8px;
        border-color: #e8edf3;
        color: #475569;
    }

    .apidoc-bar__ops .layui-btn:hover {
        border-color: rgba(64, 204, 146, .45);
        color: #2db87d;
    }

    #swagger-ui {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 16px 0;
        background: transparent;
        border-radius: 0;
        overflow: visible;
    }

    #swagger-ui .swagger-ui {
        font-family: inherit;
        font-size: 13px;
        line-height: 1.6;
        color: #1a2233;
    }

    #swagger-ui .swagger-ui section {
        margin: 0;
        padding: 0;
    }

    #swagger-ui .swagger-ui .wrapper {
        max-width: none;
        margin: 0;
        padding: 0;
    }

    /* ── 文档抬头 ── */
    #swagger-ui .swagger-ui .info {
        margin: 0 0 12px;
        padding: 16px 18px;
        background: #fff;
        border: 1px solid #e8edf3;
        border-radius: 12px;
    }

    #swagger-ui .swagger-ui .info hgroup.main {
        margin: 0;
    }

    #swagger-ui .swagger-ui .info hgroup.main a.link {
        display: none;
    }

    #swagger-ui .swagger-ui .info .title {
        margin: 0;
        font-family: inherit;
        font-size: 20px;
        font-weight: 600;
        color: #1a2233;
    }

    #swagger-ui .swagger-ui .info .title small {
        margin-left: 6px;
    }

    #swagger-ui .swagger-ui .info .title small pre.version {
        display: inline-block;
        padding: 2px 8px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.5;
        color: #475569;
        background: #f0f3f7;
        border-radius: 999px;
    }

    #swagger-ui .swagger-ui .info .title small.version-stamp pre.version {
        color: #2db87d;
        background: #e4f8f0;
    }

    #swagger-ui .swagger-ui .info .description,
    #swagger-ui .swagger-ui .info .description p {
        margin: 8px 0 0;
        font-size: 13px;
        line-height: 1.8;
        color: #475569;
    }

    /* ── 服务器选择 / 过滤框 ── */
    #swagger-ui .swagger-ui .scheme-container {
        margin: 0 0 12px;
        padding: 0;
        background: transparent;
        box-shadow: none;
    }

    #swagger-ui .swagger-ui .scheme-container .servers {
        padding: 10px 14px;
        background: #fff;
        border: 1px solid #e8edf3;
        border-radius: 12px;
        box-shadow: none;
    }

    #swagger-ui .swagger-ui .servers > select {
        min-width: 260px;
        height: 32px;
        line-height: 32px;
        font-size: 12px;
        color: #475569;
        border: 1px solid #e8edf3;
        border-radius: 8px;
    }

    #swagger-ui .swagger-ui section.filter.wrapper {
        margin: 0 0 12px;
        padding: 0;
    }

    #swagger-ui .swagger-ui .filter .operation-filter-input {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 9px 12px;
        font-size: 13px;
        color: #1a2233;
        background: #fff;
        border: 1px solid #e8edf3;
        border-radius: 10px;
        box-shadow: none;
    }

    #swagger-ui .swagger-ui .filter .operation-filter-input:focus {
        border-color: rgba(64, 204, 146, .55);
        box-shadow: 0 0 0 3px rgba(64, 204, 146, .14);
        outline: none;
    }

    /* ── 分组标题：swagger 默认 24px + sans-serif，这里收到 15px 卡片 ── */
    #swagger-ui .swagger-ui .opblock-tag {
        margin: 0 0 8px;
        padding: 12px 14px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        color: #1a2233;
        background: #fff;
        border: 1px solid #e8edf3;
        border-radius: 12px;
        transition: border-color .18s cubic-bezier(.22, 1, .36, 1), box-shadow .18s cubic-bezier(.22, 1, .36, 1);
    }

    #swagger-ui .swagger-ui .opblock-tag:hover {
        border-color: rgba(64, 204, 146, .45);
        box-shadow: 0 1px 4px rgba(16, 24, 40, .06);
    }

    #swagger-ui .swagger-ui .opblock-tag.nostyle,
    #swagger-ui .swagger-ui .opblock-tag a.nostyle {
        color: inherit;
        text-decoration: none;
    }

    #swagger-ui .swagger-ui .opblock-tag small {
        flex: 0 1 auto;
        padding: 0 0 0 8px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 400;
        color: #64748b;
    }

    #swagger-ui .swagger-ui .opblock-tag small p {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
    }

    #swagger-ui .swagger-ui .opblock-tag .arrow {
        color: #94a3b8;
    }

    /* ── 接口行 ── */
    #swagger-ui .swagger-ui .opblock {
        margin: 0 0 8px;
        border: 1px solid #e8edf3;
        border-radius: 12px;
        box-shadow: none;
        background: #fff;
    }

    #swagger-ui .swagger-ui .opblock .opblock-summary {
        padding: 10px 14px;
        border-width: 0;
    }

    #swagger-ui .swagger-ui .opblock.opblock-get,
    #swagger-ui .swagger-ui .opblock.opblock-post,
    #swagger-ui .swagger-ui .opblock.opblock-put,
    #swagger-ui .swagger-ui .opblock.opblock-delete {
        border-color: #e8edf3;
        background: #fff;
    }

    #swagger-ui .swagger-ui .opblock-summary-method {
        min-width: 62px;
        padding: 5px 0;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
        border-radius: 8px;
    }

    #swagger-ui .swagger-ui .opblock-summary-path,
    #swagger-ui .swagger-ui .opblock-summary-path__deprecated {
        padding: 0;
        font-family: Consolas, Monaco, "Courier New", monospace;
        font-size: 13px;
        color: #1a2233;
        word-break: break-all;
    }

    #swagger-ui .swagger-ui .opblock-summary-description {
        font-family: inherit;
        font-size: 12px;
        color: #64748b;
    }

    #swagger-ui .swagger-ui .opblock-body {
        background: #fbfcfe;
        border-top: 1px solid #eef1f5;
    }

    #swagger-ui .swagger-ui .opblock-body .opblock-section-header {
        padding: 10px 14px;
        background: #f5f7fa;
        box-shadow: none;
    }

    #swagger-ui .swagger-ui .opblock-body .opblock-section-header h4 {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
    }

    #swagger-ui .swagger-ui .opblock-description-wrapper,
    #swagger-ui .swagger-ui .opblock-description-wrapper p,
    #swagger-ui .swagger-ui .opblock-external-docs-wrapper,
    #swagger-ui .swagger-ui .opblock-external-docs-wrapper p,
    #swagger-ui .swagger-ui .opblock-title_normal,
    #swagger-ui .swagger-ui .opblock-title_normal p,
    #swagger-ui .swagger-ui .markdown p,
    #swagger-ui .swagger-ui .renderedMarkdown p {
        margin: 10px 14px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.75;
        color: #475569;
    }

    #swagger-ui .swagger-ui table {
        font-family: inherit;
        border-collapse: separate;
        border-spacing: 0;
    }

    #swagger-ui .swagger-ui thead tr th,
    #swagger-ui .swagger-ui thead th {
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
        background: #f5f7fa;
        border-bottom: 1px solid #e8edf3;
    }

    #swagger-ui .swagger-ui tbody tr td,
    #swagger-ui .swagger-ui tbody tr {
        border-color: #eef1f5;
    }

    #swagger-ui .swagger-ui tbody tr {
        box-shadow: 0 1px 0 #eef1f5;
    }

    #swagger-ui .swagger-ui .parameters-col_name,
    #swagger-ui .swagger-ui .parameters-col_description {
        font-size: 13px;
        color: #475569;
    }

    #swagger-ui .swagger-ui .parameters-col_name .prop-type {
        font-size: 12px;
    }

    #swagger-ui .swagger-ui .parameters-col_name .prop-format,
    #swagger-ui .swagger-ui .parameters-col_description .markdown,
    #swagger-ui .swagger-ui .parameters-col_description .renderedMarkdown {
        font-size: 12px;
        color: #94a3b8;
    }

    #swagger-ui .swagger-ui .parameters-col_description input,
    #swagger-ui .swagger-ui .parameters-col_description textarea,
    #swagger-ui .swagger-ui .body-param__text {
        width: 100%;
        max-width: 100%;
        font-family: Consolas, Monaco, "Courier New", monospace;
        font-size: 12px;
        border: 1px solid #e8edf3;
        border-radius: 8px;
        color: #1a2233;
    }

    #swagger-ui .swagger-ui .parameters-col_description input:focus,
    #swagger-ui .swagger-ui .parameters-col_description textarea:focus,
    #swagger-ui .swagger-ui .body-param__text:focus {
        border-color: rgba(64, 204, 146, .55);
        outline: none;
    }

    #swagger-ui .swagger-ui .parameters-col_description,
    #swagger-ui .swagger-ui .response-col_description {
        font-size: 12px;
        color: #475569;
    }

    #swagger-ui .swagger-ui .parameters-col_description p,
    #swagger-ui .swagger-ui .response-col_description p {
        margin: 0;
        font-size: 12px;
        line-height: 1.6;
    }

    #swagger-ui .swagger-ui .prop-type,
    #swagger-ui .swagger-ui .response-col_status {
        font-family: inherit;
        font-size: 12px;
        color: #2db87d;
    }

    #swagger-ui .swagger-ui pre:not(.microlight) {
        padding: 10px 12px;
        font-family: Consolas, Monaco, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.6;
        color: #1a2233;
        background: #f5f7fa;
        border: 1px solid #eef1f5;
        border-radius: 8px;
    }

    /* 响应示例与 cURL 由 highlight.js 写内联样式（深底白字），这里只统一圆角、间距与滚动 */
    #swagger-ui .swagger-ui pre.microlight {
        padding: 12px !important;
        font-family: Consolas, Monaco, "Courier New", monospace !important;
        font-size: 12px;
        line-height: 1.65;
        border-radius: 10px;
        max-height: 420px;
        overflow: auto;
    }

    #swagger-ui .swagger-ui .btn,
    #swagger-ui .swagger-ui .try-out__btn,
    #swagger-ui .swagger-ui .execute {
        font-family: inherit;
    }

    #swagger-ui .swagger-ui .try-out__btn {
        border: 1px solid #e8edf3;
        border-radius: 8px;
        color: #475569;
        background: #fff;
    }

    #swagger-ui .swagger-ui .btn.execute {
        color: #fff;
        background: #40CC92;
        border-color: #40CC92;
        border-radius: 8px;
    }

    /* 末尾的 Schemas 区：swagger 默认灰底深边框、标题 16px 常规体、箭头贴最右，
       和上面的分组白卡对不上，这里统一成同一种卡片 */
    #swagger-ui .swagger-ui section.models {
        margin: 0 0 8px;
        padding: 0;
        background: #fff;
        border: 1px solid #e8edf3;
        border-radius: 12px;
        box-shadow: none;
    }

    #swagger-ui .swagger-ui section.models h4 {
        margin: 0;
        padding: 12px 14px;
        font-family: inherit;
        border-bottom: 0;
        border-radius: 12px;
        box-shadow: none;
        transition: background-color .18s cubic-bezier(.22, 1, .36, 1);
    }

    /* swagger 给 h4 画了条 rgba(59,65,81,.3) 深色下边框，展开收起都在；
       改成跟随展开状态的浅色内缩分隔线 */
    #swagger-ui .swagger-ui section.models h4 .models-control[aria-expanded="true"] {
        padding-bottom: 10px;
        border-bottom: 1px solid #eef1f5;
    }

    #swagger-ui .swagger-ui section.models h4:hover {
        background: #f5f7fa;
    }

    #swagger-ui .swagger-ui section.models h4 .models-control {
        width: 100%;
        margin: 0;
        padding: 0;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #1a2233;
        text-align: left;
        background: none;
        border: 0;
        cursor: pointer;
    }

    /* "Schemas"/"Models" 是 bundle 里写死的英文，改不动组件也不该改；
       藏掉原节点、用后台语言渲染 ::before，React 重渲染也不会退回英文 */
    #swagger-ui .swagger-ui section.models h4 .models-control > span {
        display: none;
    }

    #swagger-ui .swagger-ui section.models h4 .models-control::before {
        content: "{:lang('admin/apidoc/schemas_label')}";
    }

    #swagger-ui .swagger-ui section.models h4 .models-control svg {
        flex: 0 0 auto;
        margin-left: 6px;
        fill: #64748b;
    }

    #swagger-ui .swagger-ui section.models .no-margin {
        padding: 0 14px 12px;
    }

    #swagger-ui .swagger-ui section.models .model-container {
        margin: 0 0 8px;
        padding: 0;
        background: #f5f7fa;
        border: 1px solid #eef1f5;
        border-radius: 10px;
    }

    #swagger-ui .swagger-ui section.models .model-container:last-child {
        margin-bottom: 0;
    }

    #swagger-ui .swagger-ui section.models .model-container > .model-box {
        display: block;
        padding: 0;
    }

    #swagger-ui .swagger-ui section.models .model-box-control {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 9px 12px;
        font-family: inherit;
        font-size: 13px;
        color: #1a2233;
        text-align: left;
        background: none;
        border: 0;
        cursor: pointer;
    }

    #swagger-ui .swagger-ui section.models .model-title {
        font-family: Consolas, Monaco, "Courier New", monospace;
        font-size: 13px;
        font-weight: 600;
        color: #1a2233;
    }

    #swagger-ui .swagger-ui section.models table.model {
        margin: 0 12px 10px;
        padding: 0;
        font-family: Consolas, Monaco, "Courier New", monospace;
        font-size: 12px;
        color: #475569;
    }

    #swagger-ui .swagger-ui section.models table.model td {
        padding: 3px 12px 3px 0;
        font-weight: 600;
        color: #475569;
        vertical-align: top;
    }

    #swagger-ui .swagger-ui section.models table.model tr.description td,
    #swagger-ui .swagger-ui section.models .renderedMarkdown,
    #swagger-ui .swagger-ui section.models .renderedMarkdown p {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-weight: 400;
        color: #64748b;
    }

    @media (max-width: 767px) {
        .apidoc-bar {
            gap: 8px 10px;
            padding: 10px 12px;
        }

        .apidoc-bar__desc {
            display: none;
        }

        .apidoc-bar__chip {
            order: 5;
            width: 100%;
        }

        .apidoc-bar__ops {
            margin-left: 0;
        }

        #swagger-ui {
            padding: 10px 10px 0;
        }

        #swagger-ui .swagger-ui .opblock-tag {
            padding: 10px 12px;
            font-size: 14px;
        }

        #swagger-ui .swagger-ui .opblock-tag small {
            display: none;
        }

        #swagger-ui .swagger-ui section.models h4 {
            padding: 10px 12px;
        }

        #swagger-ui .swagger-ui section.models h4 .models-control {
            font-size: 14px;
        }
    }
</style>

<div class="apidoc-page">
    <div class="apidoc-bar">
        <span class="apidoc-bar__title">{:lang('admin/apidoc/title')}</span>
        <span class="apidoc-bar__desc">{:lang('admin/apidoc/page_desc')}</span>
        <span class="apidoc-bar__chip">{:lang('admin/apidoc/api_base')}: {$api_base}</span>
        <span class="apidoc-bar__stat" id="apidocStat"></span>
        <span class="apidoc-bar__ops">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="apidocExpand">{:lang('admin/apidoc/expand_all')}</button>
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="apidocCollapse">{:lang('admin/apidoc/collapse_all')}</button>
            <a href="{:url('api_doc/openapi')}" target="_blank" class="layui-btn layui-btn-sm layui-btn-primary">{:lang('admin/apidoc/download_json')}</a>
        </span>
    </div>

    <div id="swagger-ui"></div>
</div>

<script src="__STATIC__/swagger/swagger-ui-bundle.js?{$MAC_VERSION}"></script>
<script src="__STATIC__/swagger/swagger-ui-standalone-preset.js?{$MAC_VERSION}"></script>
<script>
window.addEventListener('load', function () {
    var specUrl = "{:url('api_doc/openapi')}";
    var $stat = jQuery('#apidocStat');
    var langGroups = "{:addslashes(lang('admin/apidoc/stat_groups'))}";
    var langOps = "{:addslashes(lang('admin/apidoc/stat_ops'))}";
    var filterPh = "{:addslashes(lang('admin/apidoc/filter_ph'))}";

    function updateStat() {
        var groups = jQuery('#swagger-ui .opblock-tag').length;
        var ops = 0;
        try {
            var json = window.macSwaggerUI.specSelectors.specJson();
            var paths = (json && json.toJS ? json.toJS() : json).paths || {};
            jQuery.each(paths, function (path, item) {
                jQuery.each(item || {}, function (method) {
                    if (['get', 'post', 'put', 'delete', 'patch', 'head', 'options'].indexOf(method.toLowerCase()) >= 0) ops++;
                });
            });
        } catch (e) { /* 取不到就只显示分组数 */ }
        $stat.text(groups + ' ' + langGroups + (ops ? ' / ' + ops + ' ' + langOps : ''));
    }

    // 过滤框的占位文案是 swagger 自带的英文，换成当前后台语言
    function localizeFilter() {
        jQuery('#swagger-ui .operation-filter-input').attr('placeholder', filterPh);
    }

    function setAllOpen(open) {
        jQuery('#swagger-ui .opblock-tag').each(function () {
            var isOpen = jQuery(this).attr('data-is-open') === 'true';
            if (isOpen !== open) {
                var btn = this.querySelector('.expand-operation');
                if (btn) btn.click();
            }
        });
    }

    jQuery('#apidocExpand').on('click', function () { setAllOpen(true); });
    jQuery('#apidocCollapse').on('click', function () { setAllOpen(false); });

    window.macSwaggerUI = SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        docExpansion: 'none',
        defaultModelsExpandDepth: 0,
        filter: true,
        tryItOutEnabled: true,
        presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
        ],
        plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'BaseLayout',
        // 在线调试时携带后台同源 Cookie，便于调试需登录接口
        requestInterceptor: function (req) {
            req.credentials = 'same-origin';
            return req;
        },
        onComplete: function () {
            updateStat();
            localizeFilter();
        }
    });
    updateStat();
});
</script>

{include file="../../../app/admin/view/public/foot" /}
</body>
</html>
