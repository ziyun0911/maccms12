<div class="layui-form-item upload_mode mode_Ftp" {if condition="$config['upload']['mode'] neq 'Ftp'"}style="display:none;" {/if}>
<label class="layui-form-label">FTP{:lang('admin/upload/storage')}：</label>
<div class="layui-input-block">
    <a href="javascript:;" target="_blank" class="layui-btn layui-btn-primary">{:lang('admin/upload/ftp_tip')}</a>
</div>
</div>
<div class="layui-form-item upload_mode mode_Ftp" {if condition="$config['upload']['mode'] neq 'Ftp'"}style="display:none;" {/if}>
<label class="layui-form-label">{:lang('admin/system/config/cache_host')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][ftp][host]" placeholder="{:lang('admin/upload/host_ph')}" value="{$config['upload']['api']['ftp']['host']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('admin/system/config/cache_port')}：</label>
<div class="layui-input-inline w100">
    <input type="text" name="upload[api][ftp][port]" placeholder="{:lang('admin/upload/port_ph')}" value="{$config['upload']['api']['ftp']['port']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('access')}：</label>
<div class="layui-input-inline w100">
    <input type="text" name="upload[api][ftp][user]" placeholder="{:lang('admin/upload/ftp_user_ph')}" value="{$config['upload']['api']['ftp']['user']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('pass')}：</label>
<div class="layui-input-inline w100">
    <input type="text" name="upload[api][ftp][pwd]" placeholder="{:lang('admin/upload/ftp_pwd_ph')}" value="{$config['upload']['api']['ftp']['pwd']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('path')}：</label>
<div class="layui-input-inline w100">
    <input type="text" name="upload[api][ftp][path]" placeholder="{:lang('admin/upload/root_ph')}" value="{$config['upload']['api']['ftp']['path']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('admin/upload/ext_url')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][ftp][url]" placeholder="{:lang('admin/upload/ext_url')}" value="{$config['upload']['api']['ftp']['url']}" class="layui-input">
</div>
</div>
