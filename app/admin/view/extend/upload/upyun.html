<div class="layui-form-item upload_mode mode_Upyun" {if condition="$config['upload']['mode'] neq 'Upyun'"}style="display:none;" {/if}>
<label class="layui-form-label">{:lang('admin/upload/upyun')}API：</label>
<div class="layui-input-block">
    <a href="https://www.upyun.com/" target="_blank" class="layui-btn layui-btn-primary">{:lang('admin/upload/click_apply')} https://www.upyun.com/?maccms</a>
</div>
</div>
<div class="layui-form-item upload_mode mode_Upyun" {if condition="$config['upload']['mode'] neq 'Upyun'"}style="display:none;" {/if}>
<label class="layui-form-label">{:lang('admin/upload/service_name')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][upyun][bucket]" placeholder="{:lang('admin/upload/upyun')}-{:lang('admin/upload/service_name')}" value="{$config['upload']['api']['upyun']['bucket']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('admin/upload/operator')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][upyun][username]" placeholder="{:lang('admin/upload/upyun')}-{:lang('admin/upload/operator')}" value="{$config['upload']['api']['upyun']['username']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('admin/upload/operator_pwd')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][upyun][pwd]" placeholder="{:lang('admin/upload/upyun')}-{:lang('admin/upload/operator_pwd')}" value="{$config['upload']['api']['upyun']['pwd']}" class="layui-input">
</div>
<label class="layui-form-label">{:lang('admin/upload/ext_url')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][upyun][url]" placeholder="{:lang('admin/upload/upyun')}-{:lang('admin/upload/ext_url')}" value="{$config['upload']['api']['upyun']['url']}" class="layui-input">
</div>
</div>
