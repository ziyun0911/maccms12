<div class="layui-form-item upload_mode mode_Qiniu" {if condition="$config['upload']['mode'] neq 'Qiniu'"}style="display:none;" {/if}>
<label class="layui-form-label">{:lang('admin/upload/qiniu')}API：</label>
<div class="layui-input-block">
    <a href="https://www.qiniu.com/" target="_blank" class="layui-btn layui-btn-primary">{:lang('admin/upload/click_apply')} https://www.qiniu.com/?maccms</a>
</div>
</div>
<div class="layui-form-item upload_mode mode_Qiniu" {if condition="$config['upload']['mode'] neq 'Qiniu'"}style="display:none;" {/if}>
<label class="layui-form-label">{:lang('admin/upload/service_name')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][qiniu][bucket]" placeholder="{:lang('admin/upload/qiniu')}-{:lang('admin/upload/service_name')}" value="{$config['upload']['api']['qiniu']['bucket']}" class="layui-input"   form="form_config_upload">
</div>
<label class="layui-form-label">{:lang('admin/upload/public_key')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][qiniu][accesskey]" placeholder="{:lang('admin/upload/qiniu')}-{:lang('admin/upload/public_key')}" value="{$config['upload']['api']['qiniu']['accesskey']}" class="layui-input"   form="form_config_upload">
</div>
<label class="layui-form-label">{:lang('admin/upload/private_key')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][qiniu][secretkey]" placeholder="{:lang('admin/upload/qiniu')}-{:lang('admin/upload/private_key')}" value="{$config['upload']['api']['qiniu']['secretkey']}" class="layui-input"   form="form_config_upload">
</div>
<label class="layui-form-label">{:lang('admin/upload/ext_url')}：</label>
<div class="layui-input-inline w200">
    <input type="text" name="upload[api][qiniu][url]" placeholder="{:lang('admin/upload/qiniu')}-{:lang('admin/upload/ext_url')}" value="{$config['upload']['api']['qiniu']['url']}" class="layui-input"   form="form_config_upload">
</div>
</div>
