{include file="../../../app/admin/view/public/head" /}
<div class="page-container p10">
    <form class="layui-form layui-form-pane" method="post" action="">
        <input id="gbook_id" name="gbook_id" type="hidden" value="{$info.gbook_id}">
        <input id="gbook_rid" name="gbook_rid" type="hidden" value="{$info.gbook_rid}">
        <div class="layui-form-item">

            <label class="layui-form-label">{:lang('nickname')}：</label>
            <div class="layui-input-inline w80">
                <input type="text" class="layui-input" value="{$info.gbook_name}" readonly="readonly" name="gbook_name" >
            </div>
            <label class="layui-form-label">{:lang('admin/gbook/msg_time')}：</label>
            <div class="layui-input-inline w130">
                <input type="text" class="layui-input" value="{$info.gbook_time|date='Y-m-d H:i:s'}" readonly="readonly">
            </div>
            <label class="layui-form-label">{:lang('reply_time')}：</label>
            <div class="layui-input-inline w130">
                <input type="text" class="layui-input" value="{$info.gbook_reply_time|date='Y-m-d H:i:s'}" readonly="readonly">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('admin/gbook/msg_content')}：</label>
            <div class="layui-input-block">
                <textarea type="text" class="layui-textarea" lay-verify="gbook_content" placeholder="{:lang('admin/gbook/content_ph')}" name="gbook_content">{$info.gbook_content}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{:lang('admin/template/reply_content')}：</label>
            <div class="layui-input-block">
                <textarea type="text" class="layui-textarea" lay-verify="gbook_reply" placeholder="{:lang('admin/gbook/reply_ph')}" name="gbook_reply">{$info.gbook_reply}</textarea>
            </div>
        </div>

        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit" data-child="true">{:lang('btn_save')}</button>
                <button class="layui-btn layui-btn-primary" type="reset">{:lang('btn_reset')}</button>
            </div>
        </div>
    </form>

</div>
{include file="../../../app/admin/view/public/foot" /}

<script type="text/javascript">
    layui.use(['form', 'layer'], function () {
        var form = layui.form
                , layer = layui.layer
                , $ = layui.jquery;

        form.verify({
            gbook_content: function (value) {
                if (value == "") {
                    return "{:lang('admin/gbook/content_required')}";
                }
            }
        });

    });
</script>

</body>
</html>
