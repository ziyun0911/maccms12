<!DOCTYPE html>
<html lang="{:mac_html_lang()}">
<head>
    {include file="public/include"}
    <link rel="stylesheet" type="text/css" href="{$maccms.path_tpl}asset/css/live-play.css?v=2026111215" />
    <link rel="stylesheet" type="text/css" href="{$maccms.path}static/player/dplayer/DPlayer.min.css" />
</head>
<body id="livePlayPage" class="live-play-body">
    {include file="public/th" /}
    {assign name="isSingleRow" value="1"}
    {include file="public/head" /}
    <div id="live_play_page" class="live-play" data-live-id="{$live_id|default=0}" data-play-url-pattern="{:mac_url('live/play',['id'=>'__ID__'])}">
        <main class="live-play__layout">
            <section class="live-play__main" data-aria-label="string_live_player" aria-label="直播播放器">
                <div class="live-play__player-wrap embed-responsive embed-responsive-16by9">
                    <div id="live_dplayer_cnt" class="live-play__dplayer embed-responsive-item"></div>
                    <!-- 失败提示条由 live-play.js 动态插入：轻量贴底，不遮挡画面；不使用旧的全屏遮罩 -->
                </div>
            </section>
            <aside class="live-play__sidebar" data-aria-label="string_live_channel_lines" aria-label="选台与线路">
                <header class="live-play__meta">
                    <h1 class="live-play__title"></h1>
                    <div class="live-play__lines-bar">
                        <span class="live-play__lines-label" data-lang="live/play_lines">播放线路</span>
                        <!-- 线路栏手动刷新入口：点击重载当前线路，并重置自动切线路的重试次数 -->
                        <button type="button" class="live-play__refresh-hint js-live-refresh" title="刷新当前线路" aria-label="刷新当前线路">
                            <img class="live-play__refresh-hint-icon" src="{$maccms.path_tpl}asset/img/live-tis-ic@2x.png" alt="" width="14" height="14" decoding="async" />
                            <span class="live-play__refresh-hint-text" data-lang="live/refresh_hint">如加载失败请刷新</span>
                        </button>
                    </div>
                    <div class="live-play__lines" role="group" data-aria-label="live/play_lines" aria-label="播放线路"></div>
                </header>
                <div class="live-play__picker">
                    <h2 class="live-play__picker-title" data-lang="live/picker_title">选台器</h2>
                    <div class="live-play__tabs" role="tablist"></div>
                    <ul class="live-play__channel-list" role="list"></ul>
                </div>
            </aside>
        </main>
        <script type="text/javascript" src="{$maccms.path}static/player/dplayer/flv.min.js"></script>
        <script type="text/javascript" src="{$maccms.path}static/player/dplayer/hls.min.js"></script>
        <script type="text/javascript" src="{$maccms.path}static/player/dplayer/dash.all.min.js"></script>
        <script type="text/javascript" src="{$maccms.path}static/player/dplayer/webtorrent.min.js"></script>
        <script type="text/javascript" src="{$maccms.path}static/player/dplayer/DPlayer.min.js"></script>
        <script type="text/javascript" src="{$maccms.path_tpl}asset/js/live-play.js?v=2026111501"></script>
    </div>
    {include file="public/foot"}
</body>
</html>
