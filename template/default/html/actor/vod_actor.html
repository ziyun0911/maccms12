<li class="vodlist_item">
	<a class="vodlist_thumb lazyload" href="{$vo|mac_url_actor_detail}" title="{$vo.actor_name}" data-mac-letter="{$vo.actor_name|mb_substr=0,1}" data-original="{$vo.actor_pic|mac_url_img}">
		<span class="play hidden_xs"></span>
		{if condition="$vo.actor_pic eq ''"}<span class="mac-catalog-show__ph-letter">{$vo.actor_name|mb_substr=0,1}</span>{else/}<span class="pic_text text_right">{$vo.actor_remarks}</span>{/if}

	<div class="vodlist_titbox">									
		<p class="vodlist_title"><a href="{$vo|mac_url_actor_detail}" title="{$vo.actor_name}">{$vo.actor_name}</a></p>
