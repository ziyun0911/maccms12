<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="{:mac_html_lang()}"><head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>{:mac_front_string('user_quick_sign_title','每日签到')} - {:mac_front_string('string_user_center','个人中心')} - {$maccms.site_name}</title>
<meta name="keywords" content="{$maccms.site_keywords}"/>
<meta name="description" content="{$maccms.site_description}"/>
{include file="user/include" /}
<link rel="stylesheet" type="text/css" href="{$maccms.path_tpl}asset/css/user-checkin.css">
<link rel="stylesheet" type="text/css" href="{$maccms.path_tpl}asset/css/user-checkin-calendar.css?v=2026111019">
</head>
<body class="mac-checkin-wrap user-checkin-page">
{include file="public/th" /}
{include file="public/head" /}

<div class="member-wrap member-wrap-bg" id="mac-user-checkin-root"
	data-url-get-sign-info="{:rtrim($maccms.path,'/').'/api.php/Task/get_sign_info'}"
	data-url-get-task-list="{:rtrim($maccms.path,'/').'/api.php/Task/get_task_list'}"
	data-url-daily-sign="{:rtrim($maccms.path,'/').'/api.php/Task/daily_sign'}"
	data-url-claim-milestone="{:rtrim($maccms.path,'/').'/api.php/Task/claim_sign_milestone'}"
	data-url-login="{:url('user/login')}"
	data-coin-img="{$maccms.path_tpl}/images/user/recharge-coin.png"
	data-check-ico="{$maccms.path_tpl}asset/img/checkin/milestone-check.png">
<div id="member" class="fn-clear">
	<div id="left">
        <div class="m-nav">
			<a href="javascript:MAC.GoBack()" class="btn-left"><i class="iconfont ico-right">&#xe625;</i></a>
			<a href="{$maccms.path}" class="btn-right"><i class="iconfont ico-right">&#xe634;</i></a>
			<span class="mb-title" data-lang="string_user_center">个人中心</span>
	    </div>
        {include file="user/left_nav" /}
	</div>

    <div id="right">
		<div class="m-nav uc-checkin-mnav">
			<a href="javascript:MAC.GoBack()" class="btn-left" data-aria-label="string_fh" aria-label="返回"><i class="iconfont ico-right">&#xe625;</i></a>
			<span class="mb-title" data-lang="user_checkin_page_title">每日签到</span>
		</div>

	    <div class="co-right co-right-bg co-hi user-checkin checkin-page">
			<div class="uc-checkin-sheet">
				<div class="uc-checkin-hero-card">
					<div class="uc-hero__user" id="mac-user-checkin-hero" data-default-avatar="{$maccms.path_tpl}/images/user/touxiang.png">
						<span class="uc-hero__avatar-wrap">
							<span class="mac-avatar mac-avatar--md mac-avatar--checkin">
								<img class="mac-avatar__img uc-hero__avatar" src="{$maccms.path_tpl}/images/user/touxiang.png" width="56" height="56" decoding="async" alt="" />
							</span>
						</span>
						<div class="uc-hero__stats">
							<p class="uc-hero__label" data-lang="user_checkin_total_label">累计领取金币</p>
							<p class="uc-hero__value">
								<img class="uc-hero__coin-ico" src="{$maccms.path_tpl}/images/user/recharge-coin.png" width="22" height="22" alt="" decoding="async" />
								<span class="uc-hero__num">0</span>
							</p>
						</div>
					</div>
				</div>

			<!-- 日历区标题：外置于卡片上方，与下方「签到规则」标题同款式、同左缘对齐 -->
			<h2 class="uc-rules__title uc-calendar__outer-title" id="uc-calendar-title" data-lang="user_checkin_calendar_title">签到日历</h2>

			<!-- 顶部横排：签到日历(左,大) + 里程碑奖励(右,压缩) -->
			<div class="uc-top-row">
				<section class="uc-calendar" id="mac-checkin-calendar" aria-labelledby="uc-calendar-title">
					<div class="uc-calendar__bar">
						<button type="button" class="uc-calendar__nav" id="mac-checkin-cal-prev" aria-label="上个月">&#8249;</button>
						<span class="uc-calendar__month" id="mac-checkin-cal-month"></span>
							<button type="button" class="uc-calendar__nav" id="mac-checkin-cal-next" aria-label="下个月">&#8250;</button>
						</div>
						<div class="uc-calendar__week" aria-hidden="true">
							<span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
						</div>
						<div class="uc-calendar__grid" id="mac-checkin-cal-grid"></div>
						<p class="uc-calendar__summary" id="mac-checkin-cal-summary"></p>
					</section>

					<section class="uc-milestones uc-milestones--side" data-mac-checkin-section-aria="user_checkin_milestones_section">
						<p class="uc-milestones__guest-msg" id="mac-checkin-milestones-guest" data-lang="user_checkin_milestones_login" hidden>登录后查看签到里程碑</p>
						<div class="uc-milestones__grid" id="mac-checkin-milestones-root" hidden></div>
					</section>
				</div>

				<div class="uc-checkin-card uc-checkin-card--main">
					<div class="uc-cta-wrap" id="mac-checkin-cta-wrap"></div>
				</div>

				<section class="uc-rules" aria-labelledby="uc-rules-h" data-site-name="{$maccms.site_name}">
					<h2 class="uc-rules__title" id="uc-rules-h" data-lang="user_checkin_rules_title">签到规则</h2>
					<ol class="uc-rules__list" id="mac-checkin-rules-list"></ol>
				</section>
			</div>
	    </div>
    </div>
</div>
<div style="width:30rem;margin: 2rem auto;">
	{include file="public/friendLink" }
</div>
</div>

{include file="public/foot" /}
<script type="text/javascript" src="{$maccms.path_tpl}asset/js/user-checkin.js?v=2026111704"></script>
<script type="text/javascript" src="{$maccms.path_tpl}asset/js/user-checkin-calendar.js?v=2026111703"></script>
</body>
</html>
