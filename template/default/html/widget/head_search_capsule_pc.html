                        <div class="head_search_row head_search_row_capsule">

                                    {include file="widget/head_search_type_drop" /}
                                    <span class="head_search_capsule_hot" aria-hidden="true"><img src="{$maccms.path_tpl}images/layout/hot.svg" alt=""></span>
                                    <div class="head_search_capsule_field">
                                        <input id="txt" autocomplete="off" type="text" name="wd" class="mac_wd form_control js-pc-search-input" value="{$param.wd}" placeholder="">
                                        <div class="head_hot_overlay head_hot_overlay_home" data-fallback-hot-lang="string_home_search_placeholder" data-hot-words="{:htmlspecialchars(isset($maccms['search_hot']) ? (string)$maccms['search_hot'] : '', ENT_QUOTES, 'UTF-8')}" data-permanent-hot="{:htmlspecialchars(isset($_SERVER['HTTP_HOST']) ? $_SERVER['HTTP_HOST'] : '', ENT_QUOTES, 'UTF-8')}" data-permanent-hot-lang="string_site_domain_prefix" id="headHotOverlayPc">

                                    </div>

                                        <span data-lang="string_search">搜索</span>

                                </div>
                            </form>
                        </div>
                        {include file="widget/head_search_hot_autocollect" /}
