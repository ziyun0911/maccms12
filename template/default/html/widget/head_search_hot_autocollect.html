<script>
(function () {
    if (window.__macHotAutoCollect) { return; }
    window.__macHotAutoCollect = true;
    var mode = "{:htmlspecialchars((string)(isset($maccms['search_hot_collect']) ? $maccms['search_hot_collect'] : 'refresh'), ENT_QUOTES, 'UTF-8')}";
    if (mode === 'off') { return; }
    var base = "{$maccms.path}";
    var url = base + 'index.php/ajax/search_hot?limit=15&days=30' + (mode === 'refresh' ? '&_ts=' + Date.now() : '');
    function render(words) {
        var $ = window.jQuery;
        if (!$) { return; }
        $('.head_hot_overlay').attr('data-hot-words', words.join(','));
        $('.head_hot_overlay').each(function () {
            var ov = $(this), track = ov.find('.head_hot_overlay_track');
            if (!track.length) { return; }
            track.empty();
            for (var k = 0; k < 2; k++) {
                $.each(words, function (i, w) {
                    var sp = $('<span class="head_hot_overlay_item"/>').text(w);
                    if (i === 0) { sp.addClass('head_hot_overlay_item_primary'); }
                    track.append(sp);
                });
            }
            track.css('animation-duration', Math.max(10, words.length * 2.2) + 's');
            ov.toggleClass('head_hot_overlay_single', words.length <= 1);
        });
        $('.mac_results_hot .hot_keys').each(function () {
            var ul = $(this);
            ul.empty();
            $.each(words, function (i, w) {
                var href = base + 'index.php/vod/search.html?wd=' + encodeURIComponent(w);
                $('<a class="search_key"/>').attr('href', href).text(w).appendTo($('<li/>').appendTo(ul));
            });
        });
    }
    function run() {
        var $ = window.jQuery;
        if (!$) { return; }
        $.getJSON(url, function (res) {
            var words = [];
            if (res && res.data) {
                (res.data.hot || []).forEach(function (o) { if (o && o.word) { words.push(String(o.word)); } });
                (res.data.config_hot || []).forEach(function (o) {
                    if (o && o.word && words.indexOf(String(o.word)) < 0) { words.push(String(o.word)); }
                });
            }
            words = words.slice(0, 15);
            if (!words.length) { return; }
            setTimeout(function () { render(words); }, 620);
        });
    }
    if (window.jQuery) { jQuery(run); }
})();
</script>
